# Construye las imágenes Docker de backend y storefront en los runners de
# GitHub (x86 nativo, ~5 min) y las publica en GHCR. Dokploy luego solo las
# descarga (Provider → Docker), sin construir nada en el servidor.
#
# Imágenes resultantes:
#   ghcr.io/unlimiteddco/rtbunker-backend:latest
#   ghcr.io/unlimiteddco/rtbunker-storefront:latest
#
# NOTA storefront: las NEXT_PUBLIC_* se queman en build-time → van como
# build-args con los valores de STAGING (todas son públicas de cliente, no
# hay secretos: publishable key, pk_test de Stripe, dominio, WhatsApp).
# Para producción real, cambiar estos valores y relanzar el workflow.

name: docker-images

on:
  push:
    branches: [main, feat/cambios-reunion-nikita]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/unlimiteddco/rtbunker-backend:latest
            ghcr.io/unlimiteddco/rtbunker-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/storefront/Dockerfile
          push: true
          tags: |
            ghcr.io/unlimiteddco/rtbunker-storefront:latest
            ghcr.io/unlimiteddco/rtbunker-storefront:${{ github.sha }}
          cache-from: type=gha,scope=storefront
          cache-to: type=gha,scope=storefront,mode=max
          build-args: |
            NEXT_PUBLIC_MEDUSA_BACKEND_URL=https://api.rtbunker.bellostas.studio
            NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=pk_41bef6f8314c75866eef77c942a7d247e1fefdb52e24b8ba80136b77a23d04f3
            NEXT_PUBLIC_BASE_URL=https://rtbunker.bellostas.studio
            NEXT_PUBLIC_DEFAULT_REGION=es
            NEXT_PUBLIC_SITE_NOINDEX=true
            NEXT_PUBLIC_STRIPE_KEY=pk_test_51Tc6XGPVrdgeoL7jgxiQL2vEOb0CvdWR3s3sie4e7tbDuEFsqxM0PUf1tumNYvav33Vfm7grEpUBwEFtpsGvT7qt00mOcv8KfG
            NEXT_PUBLIC_WHATSAPP_NUMBER=34624690489
            NEXT_PUBLIC_WHATSAPP_TEXT=Hola RT Bunker, tengo una consulta
            NEXT_PUBLIC_PAYPAL_CLIENT_ID=
